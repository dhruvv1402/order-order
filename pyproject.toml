[project]
name = "orderorder"
version = "0.1.0"
description = "Citation-integrity engine for Indian case law: does the case exist, which paragraph, and does it support the proposition to the extent claimed."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-cerebras>=0.8.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "model2vec>=0.9.0",
    "pandas>=3.0.5",
    "pgvector>=0.5.0",
    "psycopg[binary,pool]>=3.3.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0.52",
    "strands-agents[litellm]>=1.55.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

# The Chroma vector store is an optional backend: ranking reads the memmap, and chromadb is only
# needed by `orderorder chroma-import` / `chroma-search`. It is an extra rather than a dependency
# because 1.5.9 -- the newest release -- carries five open PYSEC advisories (2026-311, -3813,
# -3814, -3815) with no fixed version published yet, and the audit job correctly fails the build
# on locked production dependencies. Install it explicitly when you want the database:
#   uv sync --extra chroma
[project.optional-dependencies]
chroma = ["chromadb>=1.5.9"]

[project.scripts]
orderorder = "orderorder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The page is data inside the package, and hatchling ships every file under a packaged directory. A
# force-include of the same directory adds it a second time and the build fails outright, which is
# how the container build first found this.
packages = ["src/orderorder"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: Typer declares CLI options as call expressions in argument defaults; that is its documented API.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
# Import the source next to these tests, not whichever copy an editable install happens to point at.
# `uv sync` writes one absolute path into the environment, so a second checkout of this repository --
# a git worktree, a clone beside it, a container that mounts the source somewhere else -- runs its
# tests against the first checkout's code and passes while proving nothing about its own.
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
