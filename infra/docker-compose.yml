# Hackathon profile: only Postgres runs in Docker; the API and engine run from the virtualenv.
# Before `docker compose up`, check that Docker has room for its disk image (docs/TECH_STACK.md section 9).
#
#   docker compose -f infra/docker-compose.yml --profile hackathon up -d postgres
#
# Serving profile: the engine in a container too, for a box that is not a development machine.
#
#   ORDERORDER_API_TOKEN=$(openssl rand -hex 32) \
#     docker compose -f infra/docker-compose.yml --profile serve up -d
#
# The token is required and there is no default for it. `orderorder serve` refuses to bind anything
# but loopback without one, so a stack brought up with no token set fails at boot rather than
# publishing nine thousand judgments and a billable model key to whatever can reach the port.
services:
  postgres:
    image: pgvector/pgvector:pg17
    profiles: [hackathon, prod, serve]
    environment:
      POSTGRES_USER: orderorder
      POSTGRES_PASSWORD: orderorder
      POSTGRES_DB: orderorder
    ports:
      - "5432:5432"
    volumes:
      - "${ORDERORDER_DATA_DIR:-../data}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderorder -d orderorder"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    profiles: [serve]
    # Published to loopback only. Put a reverse proxy in front of it for anything else, so that TLS
    # and the token are somebody's explicit decision rather than a port that happened to be open.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # No default. Compose substitutes an empty string for an unset variable, and an empty token is
      # the same as no token, so `serve` refuses to start -- which is the intended failure.
      ORDERORDER_API_TOKEN: "${ORDERORDER_API_TOKEN:?set a token: openssl rand -hex 32}"
      ORDERORDER_DATA_DIR: /data
      # Empty means the SQLite file under /data. Point it at the postgres service to use that instead.
      DATABASE_URL: "${DATABASE_URL-}"
      LLM_PRIMARY: "${LLM_PRIMARY-}"
      LLM_FALLBACKS: "${LLM_FALLBACKS-}"
      LLM_BASE_URL: "${LLM_BASE_URL-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY-}"
      GROQ_API_KEY: "${GROQ_API_KEY-}"
      CEREBRAS_API_KEY: "${CEREBRAS_API_KEY-}"
      # The agent's own model. This list is an allowlist, not a pass-through, so a Bedrock setting
      # that is not named here never reaches the container however carefully it was put in `.env` --
      # and the agent then falls back to a provider key above and keeps answering, which is the
      # failure that looks like success (DEPLOYMENT.md 4.5a).
      #
      # Credentials are deliberately absent. On the instance the role is the credential and needs no
      # variable at all: botocore reaches the metadata service from inside the container, provided the
      # instance's IMDS hop limit is 2. `AWS_BEARER_TOKEN_BEDROCK` is here for the boxes that have no
      # role to attach, and belongs in SSM like every other key.
      AGENT_MODEL: "${AGENT_MODEL-}"
      BEDROCK_MODEL: "${BEDROCK_MODEL-}"
      BEDROCK_REGION: "${BEDROCK_REGION-}"
      AWS_BEARER_TOKEN_BEDROCK: "${AWS_BEARER_TOKEN_BEDROCK-}"
    volumes:
      # The corpus is state and lives outside the image. Read-write because ingestion, the full-text
      # index and the vector store all write here.
      #
      # This is a bind mount, so the *host* directory's ownership is what the container sees, and the
      # image runs as uid 10001. A root-owned directory here leaves the engine unable to write its own
      # corpus, and it fails on the first request rather than at boot. Before the first `up`:
      #     sudo install -d -o 10001 -g 10001 <the host data directory>
      - "${ORDERORDER_DATA_DIR:-../data}:/data"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    profiles: [offline]
    ports:
      - "11434:11434"
    volumes:
      - "${ORDERORDER_DATA_DIR:-../data}/ollama:/root/.ollama"
