name: Deploy to EC2

on:
  push:
    branches: [ production ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/order-order
            git fetch origin production
            git checkout production
            git pull origin production
            docker compose --env-file .env -f infra/docker-compose.yml --profile serve up -d --build
            docker image prune -f
